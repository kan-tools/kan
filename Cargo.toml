[package]
name = "kan"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Local reasoning, global coherence — memory for AI agents."
repository = "https://github.com/kan-tools/kan"

[dependencies]
atrium-api = { version = "0.25.8", default-features = false }
atrium-crypto = "0.1.3"
atrium-identity = "0.1.9"
atrium-repo = "0.1.8"
ipld-core = { version = "0.4.3", features = ["serde"] }
rand = "0.8"
rmcp = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_ipld_dagcbor = "0.6.4"
sha2 = "0.10"
thiserror = "2.0.18"
tiktoken-rs = "0.12.0"
tokio = { version = "1.52.4", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
