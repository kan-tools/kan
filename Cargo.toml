[package]
name = "kan"
version = "1.0.0-beta.1"
edition = "2021"
default-run = "kan"
# Verified, not inferred: CI's `msrv` job reads this value and builds with
# exactly it, so the declaration cannot drift from the truth. The floor is set
# by libsqlite3-sys's use of `cfg_select!`, which is unstable before 1.95 --
# 1.94 and below fail to compile the build script. Bumping this line
# re-points the CI job automatically; there is nothing else to update.
rust-version = "1.95"
authors = ["Maxine Levesque"]
license = "MIT"
description = "Local reasoning, global coherence — memory for AI agents."
repository = "https://github.com/kan-tools/kan"
homepage = "https://github.com/kan-tools/kan"
documentation = "https://docs.rs/kan"
readme = "README.md"
keywords = ["agents", "provenance", "append-only", "content-addressed", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Draft RFC 4 reference API. No production caller or stable wire promise.
evidence-contract = []
v2-storage = ["evidence-contract", "rusqlite/backup", "rusqlite/limits"]
v2-service = ["v2-storage", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:reqwest", "tokio/net", "tokio/time", "tokio/sync"]
v2-crypto = ["v2-service", "dep:hpke", "dep:rustls", "dep:tokio-rustls", "tokio/io-std", "tokio/signal"]

[dependencies]
atproto-dasl = "0.14.5"
atproto-repo = "0.14.5"
atrium-crypto = "0.1.3"
bip39 = "2.2.2"
clap = { version = "4.6.2", features = ["derive"] }
ed25519-dalek = "2.2.0"
fs4 = { version = "1.1.0", features = ["tokio"] }
hkdf = "0.12"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"], optional = true }
hyper = { version = "1.10.1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
keyring = "4.1.5"
rand = "0.8"
rmcp = { version = "2.2.0", features = ["transport-io"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rpassword = "7.5.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0.18"
tiktoken-rs = "0.12.0"
tokio = { version = "1.52.4", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util"] }
tokio-stream = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
rusqlite = { version = "0.40.1", features = ["bundled", "trace"] }
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["process", "test-util"] }

# Test fixtures deliberately corrupt/remove files. Production library code
# raises this lint to deny in src/lib.rs; integration-test crates inherit this
# allow so their fault injection need not use the production mutation facade.
[lints.clippy]
disallowed_methods = "allow"

[[bin]]
name = "kan-v2"
path = "src/bin/kan-v2.rs"
required-features = ["v2-storage"]
