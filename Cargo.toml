[package]
name = "kan"
version = "0.6.0-beta.1"
edition = "2021"
license = "MIT"
description = "Local reasoning, global coherence — memory for AI agents."
repository = "https://github.com/kan-tools/kan"
readme = "README.md"

[dependencies]
atproto-dasl = "0.14.5"
atproto-repo = "0.14.5"
atrium-crypto = "0.1.3"
clap = { version = "4.6.2", features = ["derive"] }
fs4 = { version = "1.1.0", features = ["tokio"] }
keyring = "4.1.5"
rand = "0.8"
rmcp = { version = "2.2.0", features = ["transport-io"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0.18"
tiktoken-rs = "0.12.0"
tokio = { version = "1.52.4", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["process"] }
