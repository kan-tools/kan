blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/kan-tools/kan/security/advisories/new
    about: Report privately. Please do not open a public issue for a vulnerability.
  - name: Process, workflow, or session tooling
    url: https://github.com/kan-tools/day/issues
    about: >-
      If it is buildable as a calling convention over kan's existing verbs, it
      belongs in day, the companion tool. See ADR-18.
