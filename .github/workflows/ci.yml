name: CI

on:
  push:
  pull_request:

concurrency:
  # Preserve any pre-optimization qualification already running when this
  # build profile first lands. Subsequent pushes still supersede this profile.
  group: ${{ github.workflow }}-${{ github.ref }}-v2-opt1
  cancel-in-progress: true

jobs:
  test:
    needs: msrv
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      # Repeated authenticated-history tests spend substantial time in scalar
      # arithmetic at opt-level 0. Keep the complete suite and debug/overflow
      # assertions; optimize its code and retain line information for failures.
      # The test profile inherits dev. This changes CI, not shipped profiles.
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # BEFORE the build: neither check needs a toolchain, and a sub-second
      # text check should not cost a full build+test cycle to learn about.
      #
      # The self-test runs FIRST and is the point. A checker that has silently
      # stopped detecting things is worse than no checker -- it converts an
      # unchecked area into one that merely looks checked, which is exactly
      # what the first version of this script did while its own header claimed
      # otherwise. The fixture proves each defect class is still caught before
      # any repository result is believed.
      - run: ./scripts/check-citations.sh --self-test
      - run: ./scripts/check-citations.sh
      - run: python3 scripts/evidence_reference.py --check
      - run: python3 scripts/serving_index_reference.py --check
      - run: node --test tests/library_ui.test.cjs tests/operations_ui.test.cjs tests/operations_review_ui.test.cjs tests/operations_restart_review.test.cjs tests/theme_ui.test.cjs
      - run: python3 tests/test_revert_v2.py

      - uses: Swatinem/rust-cache@v2
        with:
          key: v2-optimized-integration
      - run: cargo package --list --locked > /dev/null
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: python3 -m pip install cryptography==46.0.3
      - run: python3 .design/tools/attestation_vectors.py --check
      - run: python3 .design/tools/copy_plan_vectors.py --check
      - run: python3 .design/tools/recovery_observation_vectors.py --check
      - run: python3 .design/tools/recovery_commitments.py --check
      - run: python3 .design/tools/recovery_member_vectors.py --check
      - run: python3 .design/tools/recovery_replay_vectors.py --check
      - run: python3 .design/tools/recovery_replay_review_vectors.py --check
      - run: python3 .design/tools/recovery_bundle_review_vectors.py --check
      - run: python3 .design/tools/recovery_bundle_schema.py
      - run: python3 .design/tools/attestation_mutations.py
      - run: cargo test --no-fail-fast --features v2-crypto --test evidence_contract --test evidence_attestation --test evidence_copy_plan --test evidence_copy_source --test evidence_copy_destination --test evidence_inventory --test evidence_attested_store --test evidence_attested_followups --test evidence_attested_lifecycle --test evidence_store --test evidence_service --test evidence_spool --test evidence_http --test evidence_crypto --test evidence_keys --test evidence_reconstruction --test evidence_assembly --test evidence_assembly_review_regressions --test evidence_interpretation --test evidence_interpretation_review_regressions --test evidence_interpretation_followups --test evidence_reconstruction_review_regressions --test evidence_recovery_observation --test evidence_recovery_commitment --test evidence_recovery_commitment_review_regressions --test evidence_recovery_member --test evidence_recovery_member_review_regressions --test evidence_recovery_member_corrections --test evidence_recovery_replay --test evidence_recovery_replay_review_regressions --test evidence_recovery_bundle --test evidence_bundle_creation --test evidence_capture --test evidence_capture_adversarial --test evidence_capture_deadlines --test evidence_capture_contention --test evidence_gateway --test evidence_operations --test evidence_operations_collection --test evidence_operations_overview --test evidence_overview_review_regressions --test evidence_reader --test evidence_library_cli --test evidence_workspace --test evidence_delivery --test evidence_import --test evidence_restore --test evidence_restore_adversarial --test migration_preflight --test recovery_cli --test migration_harness --test surface_conformance -- --skip large_attempt_reads_over_ten_megabytes_with_all_chunk_citations
      - run: python3 scripts/check_gateway_global_cap.py
      - run: python3 scripts/check_v2_supervision.py target/debug/kan-v2
      - run: cargo test --features v2-crypto --lib evidence_recovery_commitment::polling_tests
      - run: cargo test --features v2-crypto --lib evidence_store::bundle::snapshot_tests
      - run: cargo test --features v2-crypto --lib evidence_assembly::tests
      - run: cargo test --features v2-crypto --lib evidence_interpretation::tests
      - run: cargo test --features v2-crypto --lib evidence_content
      - run: cargo test --features v2-crypto --lib evidence_library::proof::imports::current
      - run: cargo test --features v2-crypto --lib evidence_library::proof::knowledge
      - run: cargo test --features v2-crypto --lib evidence_library::proof::analysis::adapters
      - run: cargo test --features v2-crypto --lib evidence_library::mcp
      - run: cargo test --features v2-crypto --lib evidence_gateway::admission_tests
      - run: cargo test --features v2-crypto --lib evidence_operations::tests
      - run: cargo test --features v2-crypto --lib evidence_operations::projection::tests
      - run: cargo test --features v2-crypto --lib evidence_operations_collection::overview::tests
      - run: cargo test --features v2-crypto --lib evidence_library::budget_tests
      - run: cargo test --features v2-crypto --lib evidence_library::owner::erasure
      - run: cargo test --features v2-crypto --lib evidence_workspace::erasure::dependencies::tests
      - run: cargo test --features v2-crypto --lib evidence_spool::tests
      - run: cargo test --features v2-crypto --lib evidence_store::inventory::tests
      - run: cargo test --features v2-crypto --lib evidence_store::erasure::selection_tests
      - run: cargo test --features v2-crypto --lib evidence_control_index::tests
      - run: cargo test --features v2-crypto --lib evidence_index::tests
      - run: cargo test --features v2-crypto --lib evidence_store::attested::audit_cache_tests
      - run: cargo test --features v2-crypto --lib evidence_store::admission_tests
      - run: cargo test --features v2-crypto --lib evidence_service::audit_tests
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --features v2-crypto --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      # Compile the distributable, not just the checkout: optional v2 sources
      # and embedded frontends must survive Cargo's package file selection.
      - run: cargo package --locked --features v2-crypto
        env:
          CARGO_BUILD_JOBS: 4
      - name: Real Library browser and download qualification
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        shell: bash
        run: |
          df -h "$RUNNER_TEMP"
          python3 - <<'PY'
          import os, shutil
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < 2 * 1024 ** 3:
              raise SystemExit('Need 2 GiB free for the isolated browser runtime')
          PY
          npm install --prefix "$RUNNER_TEMP/kan-playwright" --no-save --ignore-scripts playwright@1.64.1
          "$RUNNER_TEMP/kan-playwright/node_modules/.bin/playwright" install --with-deps chromium
          cargo test --locked --features v2-crypto --test evidence_inventory --no-run --message-format=json > "$RUNNER_TEMP/kan-browser-build.jsonl"
          python3 - <<'PY'
          import json, os, signal, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          binaries = [e['executable'] for line in (root / 'kan-browser-build.jsonl').read_text().splitlines()
                      if (e := json.loads(line)).get('reason') == 'compiler-artifact'
                      and e['target']['name'] == 'evidence_inventory' and e.get('executable')]
          if len(binaries) != 1:
              raise SystemExit('Expected exactly one compiled evidence_inventory executable')
          env = {**os.environ, 'NODE_PATH': str(root / 'kan-playwright/node_modules')}
          command = ['node', 'scripts/check-library-browser.cjs', binaries[0], str(root / 'kan-library-browser')]
          with subprocess.Popen(command, env=env, start_new_session=True) as process:
              try:
                  if process.wait(timeout=600):
                      raise SystemExit('Real browser qualification failed; inspect the retained artifact')
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
                  raise
          PY
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: v2-library-browser-${{ github.sha }}
          path: ${{ runner.temp }}/kan-library-browser/
          if-no-files-found: ignore
          retention-days: 30

  # Preserve realistic large-capture qualification without blocking every
  # short integration check on rebuilding the O(n²) admission fixture. Push
  # runs own this test; the PR event uses the same head without duplicating it.
  capacity:
    needs: msrv
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: v2-capacity
      - run: cargo test --features v2-crypto --test evidence_inventory large_attempt_reads_over_ten_megabytes_with_all_chunk_citations -- --nocapture

  # THE DECLARED MSRV IS ONLY WORTH DECLARING IF SOMETHING CHECKS IT.
  # `rust-version` in Cargo.toml is a promise to consumers: cargo refuses to
  # build kan on an older toolchain and says why. Nothing makes that promise
  # TRUE, though -- a dependency bump can raise the real floor above the
  # declared one, and the declaration keeps reading fine while being wrong.
  # That is the "stated guarantee nobody checks" shape (#95), applied to the
  # build.
  #
  # THE VALUE IS READ FROM Cargo.toml RATHER THAN REPEATED HERE, so the job and
  # the manifest cannot drift. Bumping rust-version re-points this job with no
  # second edit -- a hardcoded version here would be a second source of truth
  # about one fact, which is the thing this repo keeps filing issues about.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the declared MSRV
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$v" ]; then
            echo "::error::Cargo.toml declares no rust-version, so this job has nothing to verify. Either add one or delete this job -- a job that silently checks nothing is worse than no job."
            exit 1
          fi
          echo "Declared MSRV: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # RUSTUP_TOOLCHAIN is required, not decorative: rust-toolchain.toml pins
      # `stable` and takes precedence over the toolchain installed above, so
      # without this the job would silently test stable and pass no matter what
      # the declared MSRV said. Confirmed by running it both ways.
      #
      # `check` rather than `test`: this verifies the crate COMPILES on the
      # declared floor, which is what rust-version promises. Runtime behaviour
      # is covered by the test job on stable.
      - name: Build on the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          rustc --version
          cargo check --workspace --all-targets --all-features

  # AC-3.1 OF `.design/identity-at-rest.md` NAMED A RUNNER THAT DID NOT EXIST.
  # It requires the canary -- the one test that runs kan's DEFAULT path, with
  # no KAN_NO_KEYCHAIN -- to run "on macOS CI, not only Linux", and this
  # workflow was a single ubuntu-latest job. A cold review caught the gap: an
  # acceptance criterion whose infrastructure is in no requirement is one that
  # gets quietly satisfied on Linux and called done.
  #
  # macOS IS THE ONLY PLATFORM WHERE THE CANARY MEANS ANYTHING. Linux CI has no
  # Secret Service, so a keychain-reaching code path degrades to a file there
  # and the test passes whether or not REQ-3 works. On macOS the keychain is
  # real, so `.kan/seed-id` appearing, or the command blocking, is a genuine
  # failure -- which is the whole point of a canary.
  #
  # Scoped to the identity tests rather than the full suite: macOS minutes bill
  # at 10x, and the rest of the suite is platform-independent and already
  # covered above.
  canary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A RELEASE PR runs the WHOLE suite here instead of the scoped three.
      #
      # Derived from Cargo.toml's version changing, not from a branch name, for
      # the same reason the migration matrix derives it: a convention can be
      # forgotten and a version bump cannot. The scoping comment above says the
      # rest of the suite is platform-independent, and that was true when it was
      # written -- it stopped being true when the published layout became a
      # matter of PATHS. macOS folds `Bug42` and `bug42` together and Linux does
      # not, so the one platform difference that can silently change what a
      # subject resolves to is invisible to every Linux job in this file.
      - id: release_pr
        run: |
          is_release=no
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch -q origin "${{ github.base_ref }}" || true
            base=$(git show "origin/${{ github.base_ref }}:Cargo.toml" 2>/dev/null \
                   | awk -F'"' '/^version/{print $2; exit}')
            head=$(awk -F'"' '/^version/{print $2; exit}' Cargo.toml)
            [ -n "$base" ] && [ -n "$head" ] && [ "$base" != "$head" ] && is_release=yes
          fi
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "::notice title=canary scope::release PR=$is_release"

      # No KAN_NO_KEYCHAIN anywhere in this job, deliberately. If REQ-3
      # regresses and a fresh workspace reaches for the keychain again, this is
      # where it surfaces -- as a hang (#96) or a seed-id, both of which the
      # canary asserts against.
      - name: Identity canary (ordinary PR) or the full suite (release PR)
        run: |
          if [ "${{ steps.release_pr.outputs.is_release }}" = yes ]; then
            cargo test --all
          else
            cargo test --test keychain_identity --test at_rest_guards --test keychain_one_door
          fi
        timeout-minutes: 45
