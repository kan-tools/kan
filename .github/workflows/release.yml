name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Scopes CARGO_REGISTRY_TOKEN to this job (not repo-wide) and enforces
    # the environment's deployment-tag policy (v*.*.* only) as a second,
    # independently-configured guard beyond this workflow's own trigger
    # filter above. Required-reviewer approval was the original intent but
    # isn't available for org-owned repos below GitHub Team/Enterprise
    # Cloud even on a public repo (confirmed via a 422 from the
    # environments API, not assumed) -- revisit if kan-tools ever upgrades.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Re-verify before publishing rather than trusting a separate CI run
      # (the tag push also triggers ci.yml, but a publish workflow should
      # be self-contained, not depend on cross-workflow status).
      - run: cargo package --list --locked > /dev/null
      - run: cargo build --workspace --all-targets --all-features
      - run: cargo test --workspace --no-default-features --features kan-v1
      - run: python3 -m pip install cryptography==46.0.3
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-targets --no-default-features --features kan-v1 -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo fmt --all -- --check

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      # Verify the actual packaged source, including embedded Library/Operations
      # assets and the optional v2 binary, before the registry write.
      - run: cargo package --locked --features v2-crypto
      - run: cargo package --locked --no-default-features --features kan-v1
      - run: python3 scripts/check_cli_install.py
      - run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
