name: Migration matrix

# What this build does when it meets a workspace an *older released* kan wrote.
#
# The direction is the opposite of day's matrix of the same name, and the
# difference is the point. day reads someone else's data, so its question is
# what a released binary does with shapes written today. kan owns its own
# on-disk format, so the question with teeth is the reverse: does this build
# still read a log an older kan created? A user upgrades kan and expects their
# claims to still be there. That is a **guarantee**, not a characterization.
#
# It exists because the failure it checks for has shipped twice. #90: a binary
# upgrade silently minted a new identity, and `TrustBase::Solo` then hid every
# existing claim — "no subjects yet" at exit 0 against a full log. #107: a
# `.claims/` migration fix reintroduced the very class it fixed. Both were
# found by a person, after release, and both were invisible to a green suite,
# because every test runs one binary against a workspace that same binary
# created.
#
# The cell can only detect the #90 shape at all because v0.8 shipped
# `excluded_by_trust` (ADR-57): claims present on disk but filtered out by
# trust are now reported rather than being indistinguishable from an empty
# log. The disclosure built for a consumer's sake is what makes this
# mechanizable.
#
# Outcomes are compared against `tests/fixtures/migration-expectations.tsv`.
# A tag with no committed row is an error, not a pass — a version's migration
# behaviour is a decision someone makes, never a default.

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      # DERIVED, NOT CURATED -- the whole of `src/`.
      #
      # This was a hand-written list of four paths, and it omitted
      # `src/claim.rs` and `src/fold/**`. The commit that derived the CACHE KEY
      # from `HEAD:src` named that exact omission as having "served a stale
      # ok" -- and left this list, six lines above it, untouched. Deriving the
      # cache key only fixes staleness for runs that HAPPEN; a PR changing only
      # claim decoding or the fold did not trigger this workflow at all, so
      # there was nothing to invalidate.
      #
      # The release gate was always intact (tag pushes are unfiltered). It was
      # the merge gate that had the hole, which is the worse half: a defect
      # caught at tag time has already been merged.
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/run-migration-cell.sh"
      - "tests/fixtures/migration-expectations.tsv"
      - ".github/workflows/migration-matrix.yml"
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.json }}
      cells: ${{ steps.cells.outputs.json }}
      reader: ${{ steps.hash.outputs.reader }}
      harness: ${{ steps.hash.outputs.harness }}
      rustc: ${{ steps.hash.outputs.rustc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - id: tags
        name: Enumerate the historical writers
        run: |
          # Every released tag that actually builds something OTHER than this
          # build. The rule and the reason it is content-shaped rather than
          # name-shaped live in the script; the short version is that a tag
          # whose (src, Cargo.lock, Cargo.toml) equals HEAD's puts one binary
          # in both roles, so its cell measures no upgrade and scores a
          # plausible `ok` (kan#205).
          #
          # Exclusions go to stderr, which lands in the job log, and are
          # echoed as notices so the matrix never silently covers less than
          # it appears to.
          json=$(scripts/select-migration-writers.sh "${GITHUB_REF_NAME}" \
                 2>/tmp/excluded.log)
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "matrix: $json"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice title=writer excluded::${line}"
          done < /tmp/excluded.log

      - id: hash
        name: Hash the reader and the harness
        run: |
          # DERIVED, NOT CURATED. This used to hash a hand-written list of five
          # source files -- and it omitted `src/claim.rs` and `src/fold/`, so a
          # change to how a claim DECODES invalidated nothing and every cell
          # served a stale `ok`. That is this milestone's own lesson (where an
          # enumeration keeps missing entries, derive it) applied to a cache
          # key: `HEAD:src` is git's tree object for the whole directory, so
          # there is no list to keep up to date. Docs-only commits still hit
          # the cache, which is most of this repo's churn.
          # Cargo.toml is in here because feature selection (keyring's backend,
          # for one) and [profile.release] change the reader binary while
          # leaving both `src` and Cargo.lock untouched. The previous key had
          # two of the three and described itself as having "no list to keep up
          # to date"; it was still a list, and still missing an entry.
          reader=$(printf '%s-%s-%s' "$(git rev-parse HEAD:src)" \
                                     "$(git rev-parse HEAD:Cargo.lock)" \
                                     "$(git rev-parse HEAD:Cargo.toml)" \
                   | sha256sum | cut -d' ' -f1)

          # THE HARNESS IS ITS OWN KEY COMPONENT: "what we currently consider a
          # correct migration". The cell script was already folded into the
          # reader hash; the WORKFLOW was not, so strengthening the checks in
          # this file invalidated nothing. Splitting it out is what makes the
          # table self-refilling: strengthen the harness, the hash moves once,
          # every cell re-measures under the new definition, and the next tag
          # is cheap again.
          harness=$(printf '%s-%s-%s' \
                      "$(git rev-parse HEAD:scripts/run-migration-cell.sh)" \
                      "$(git rev-parse HEAD:scripts/select-migration-writers.sh)" \
                      "$(git rev-parse HEAD:.github/workflows/migration-matrix.yml)" \
                    | sha256sum | cut -d' ' -f1)

          echo "reader=$reader" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          echo "rustc=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "reader=$reader harness=$harness"

      - id: release_pr
        name: Is this a release PR?
        run: |
          # DERIVED FROM CONTENT, NOT FROM A BRANCH NAME. A release PR is one
          # that changes the version in Cargo.toml -- which is the thing that
          # makes it a release, and cannot be forgotten the way a naming
          # convention or a label can. Same reasoning as the reader cache key
          # and as ADR-91's writer selection: where an enumeration keeps
          # missing entries, derive it.
          is_release=no
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch -q origin "${{ github.base_ref }}" || true
            base=$(git show "origin/${{ github.base_ref }}:Cargo.toml" 2>/dev/null \
                   | awk -F'"' '/^version/{print $2; exit}')
            head=$(awk -F'"' '/^version/{print $2; exit}' Cargo.toml)
            if [ -n "$base" ] && [ -n "$head" ] && [ "$base" != "$head" ]; then
              is_release=yes
              echo "::notice title=release PR::version $base -> $head; running the full matrix including the keychain plane."
            fi
          fi
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

      - id: cells
        name: Decide which (platform, mode) cells this event runs
        run: |
          # The keychain axis needs a real Secret Service, which only the macOS
          # runner has -- and macOS minutes bill at ten times Linux. So an
          # ORDINARY PR runs the two Linux modes, and a tag, a manual dispatch,
          # or a RELEASE PR runs all four.
          #
          # Release PRs were the hole. This file already records that "the
          # release gate was always intact (tag pushes are unfiltered); it was
          # the merge gate that had the hole, which is the worse half: a defect
          # caught at tag time has already been merged." That applied to the
          # path filter; it applied just as much to the keychain plane, and
          # more sharply, because the release commit is precisely the one whose
          # rows the NEXT release depends on. beta.4's keychain rows sat
          # PREDICTED through four PRs and were first measured at a tag push --
          # after merge, where ADR-78 says a red run goes unread.
          #
          # The cost is bounded by how rare release PRs are: this repo cut five
          # in a week at its fastest, against dozens of ordinary PRs.
          if [ "${{ github.event_name }}" = pull_request ] \
             && [ "${{ steps.release_pr.outputs.is_release }}" != yes ]; then
            echo 'json=[{"os":"ubuntu-latest","mode":"identity-file"},{"os":"ubuntu-latest","mode":"seed"}]' >> "$GITHUB_OUTPUT"
            echo "::notice title=matrix scope::PR run -- Linux modes only; the keychain plane is not covered here."
          else
            echo 'json=[{"os":"ubuntu-latest","mode":"identity-file"},{"os":"ubuntu-latest","mode":"seed"},{"os":"macos-latest","mode":"keychain"},{"os":"macos-latest","mode":"keychain-recovery"}]' >> "$GITHUB_OUTPUT"
          fi

  matrix:
    needs: plan
    runs-on: ${{ matrix.cell.os }}
    # The writer's three `observe` calls have no deadline of their own, and on
    # the keychain axis a writer can block on an authorization prompt nobody
    # answers. Without this the job runs to GitHub's 6h default -- at 10x macOS
    # billing, per cell, across 14 cells.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.tags) }}
        # How the identity is resolved on both sides (#146 part 3). Every
        # cell used to drive KAN_IDENTITY_FILE, which is the one branch that
        # short-circuits the other two -- so seed-rooting had never been run
        # against an older workspace, and #146's defect lived where no cell
        # could reach it.
        #
        # `keychain` is the third, added because the first two share a blind
        # spot: on Linux there is no Secret Service, so BOTH degrade to a
        # plaintext key on disk and the OS-keychain plane -- where #90, #96,
        # #107, #170 and #180 all lived -- had never been executed by any
        # cell, on any version. The mode implies its platform, so (tag, mode)
        # still identifies a row uniquely.
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: writer
        name: Resolve the writer's immutable sha
        run: echo "sha=$(git rev-parse "${{ matrix.tag }}")" >> "$GITHUB_OUTPUT"

      # Key = (writer sha, reader hash, toolchain). All three are immutable
      # inputs to a deterministic outcome, so a hit means the answer cannot
      # have changed. Adding a tag costs one cell; changing how a workspace is
      # opened costs all of them; changing neither costs nothing.
      - id: cached
        uses: actions/cache@v4
        with:
          path: migration-outcome.txt
          key: >-
            kan-migration-v3-${{ matrix.cell.mode }}-${{ steps.writer.outputs.sha
            }}-${{ needs.plan.outputs.reader }}-${{ needs.plan.outputs.harness
            }}-${{ needs.plan.outputs.rustc }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cached.outputs.cache-hit != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          key: writer-${{ matrix.tag }}

      - name: Build this build (the reader)
        if: steps.cached.outputs.cache-hit != 'true'
        run: cargo build --release --quiet

      - name: Build the historical writer
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          git worktree add --detach /tmp/writer "${{ matrix.tag }}"
          cd /tmp/writer
          # An old tag may not compile under a current toolchain. That is a
          # real outcome rather than a CI failure: a version nobody can build
          # is a version nobody is running, and saying so is more useful than
          # a red X.
          if cargo build --release --quiet 2>/tmp/build.log; then
            echo built > /tmp/writer-status
          else
            echo unbuildable > /tmp/writer-status
            tail -20 /tmp/build.log || true
          fi

      - name: Write a workspace with it, then read it with this build
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          if [ "$(cat /tmp/writer-status)" = unbuildable ]; then
            echo unbuildable > migration-outcome.txt
            exit 0
          fi
          scripts/run-migration-cell.sh \
            /tmp/writer/target/release/kan \
            "$PWD/target/release/kan" \
            "${{ matrix.cell.mode }}" > migration-outcome.txt
          cat migration-outcome.txt

      - name: Report the actual outcome, then compare against the expectation
        run: |
          outcome=$(cat migration-outcome.txt)
          # Skip comment lines, then take the outcome and its recorded reason.
          expected=$(awk -v t="${{ matrix.tag }}" -v m="${{ matrix.cell.mode }}" \
                     -F'\t' '!/^#/ && $1==t && $2==m {print $3}' \
                     tests/fixtures/migration-expectations.tsv)
          why=$(awk -v t="${{ matrix.tag }}" -v m="${{ matrix.cell.mode }}" \
                -F'\t' '!/^#/ && $1==t && $2==m {print $4}' \
                tests/fixtures/migration-expectations.tsv)

          # The actual result is reported unconditionally, before any
          # comparison: the table is checked against reality, never a
          # substitute for it.
          echo "::notice title=${{ matrix.tag }} (${{ matrix.cell.mode }})::actual=$outcome expected=${expected:-<none>}"
          {
            printf '| %s | `%s` | `%s` | `%s` | %s |\n' \
              "${{ matrix.tag }}" "${{ matrix.cell.mode }}" "$outcome" "${expected:-—}" "${why:-—}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$expected" ]; then
            echo "::error::${{ matrix.tag }} (${{ matrix.cell.mode }}) has no committed expectation. Add a row to tests/fixtures/migration-expectations.tsv -- what this build does with an older version's workspace is a decision, not a default."
            exit 1
          fi
          if [ "$outcome" != "$expected" ]; then
            echo "::error::${{ matrix.tag }} (${{ matrix.cell.mode }}): expected '$expected', got '$outcome'. A change in this build moved what it does with an older workspace. Recorded reason for the expectation: ${why:-none given}. If the move is intended, update the outcome AND its reason in the same commit that changed the behaviour -- and be sure 'intended' is not 'ok' quietly becoming 'claims-lost'."
            exit 1
          fi

          # A PREDICTION MAY NOT SURVIVE ITS OWN MEASUREMENT.
          #
          # Rows written at release time say "PREDICTED at cut time ...
          # confirmed or corrected at the next release". Three of them
          # (v0.9.2, v0.10.0, v0.11.0) were measured twice over and still said
          # PREDICTED, because nothing failed when the confirmation step was
          # skipped -- so in that file a prediction was indistinguishable from
          # a measurement, and the table under-reported its own confidence.
          #
          # This closes it structurally rather than by ritual: if the cell
          # actually EXECUTED this run (not a cache hit) and the row still
          # calls itself a prediction, that is an error with a one-line fix.
          # Same philosophy as "a tag with no row is an error, not a pass".
          # Anchored on a LEADING status token rather than a substring
          # search. The first version grepped for `PREDICTED` anywhere in the
          # reason and so fired on rows whose text merely said "was PREDICTED
          # at cut time, now measured" -- a gate that cannot tell a claim from
          # a reference to one. The `why` column therefore starts with
          # MEASURED or PREDICTED, which also makes each row state its own
          # confidence in its first word.
          case "$why" in
            PREDICTED*) predicted=yes ;;
            *)          predicted=no  ;;
          esac
          if [ "${{ steps.cached.outputs.cache-hit }}" != 'true' ] \
             && [ "$predicted" = yes ]; then
            echo "::error::${{ matrix.tag }} (${{ matrix.cell.mode }}) is recorded as PREDICTED, but this run MEASURED it as '$outcome'. Replace the prediction with the measurement (and this run's id) in tests/fixtures/migration-expectations.tsv. A prediction that is never converted is indistinguishable from a measurement, which is how three rows stayed 'PREDICTED' across two releases that had already confirmed them."
            exit 1
          fi

  report:
    needs: [plan, matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        run: |
          {
            echo "### Migration matrix"
            echo ""
            echo "Result: ${{ needs.matrix.result }}"
            echo ""
            echo "Each cell is one released kan writing a workspace, and **this build** reading it."
            echo "\`ok\` is a guarantee: kan owns this format, so an upgrade must not lose a log."
            echo ""
            echo "Per-tag rows (actual vs expected, with the recorded reason) are in the matrix jobs above."
          } >> "$GITHUB_STEP_SUMMARY"
